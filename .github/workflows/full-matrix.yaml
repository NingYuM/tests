name: Nu Setup Check

on:
  workflow_dispatch:
  schedule:
    - cron: '12 0 * * *'
    - cron: '15 2 * * *'
    - cron: '08 5 * * *'
    - cron: '11 6 * * *'
    - cron: '12 8 * * *'
    - cron: '16 10 * * *'
    - cron: '18 12 * * *'
    - cron: '55 13 * * *'
    - cron: '07 15 * * *'
    - cron: '09 17 * * *'
    - cron: '12 19 * * *'
    - cron: '15 21 * * *'
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'

defaults:
  run:
    shell: nu {0}

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest, ubuntu-latest]
        # The "full" feature was removed for Nu after v0.93.1, try to use "default" feature instead.
        ver: [0.117.0, 0.116.1, 0.115.0, 0.113.0]

    runs-on: ${{ matrix.os }}
    name: test (${{matrix.os}}, nu@${{matrix.ver}})
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Setup nu@${{matrix.ver}}
        uses: hustcer/setup-nu@main
        with:
          version: ${{matrix.ver}}
      - name: Show Nu Version
        run: |
          print $'Nu version info:(char nl)'
          print (version)
          nu nu0/test.nu
